<div class="p-4">
  <button class="bg-blue-600 text-white px-4 py-2 rounded-lg"
          (click)="abrirModalCrearCelda()">Crear</button>
</div>

<div class="p-6">
  <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
    📦 Celdas del Parqueadero
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    <div *ngFor="let celda of celdas"
         class="rounded-lg p-6 border shadow-sm text-center cursor-pointer"
         [ngClass]="{
           'bg-green-100 border-green-300': celda.estado === 'Libre',
           'bg-red-100 border-red-300': celda.estado === 'Ocupado',
           'bg-yellow-100 border-yellow-300': celda.estado === 'Reservado'
         }"
         
         (click)="celda.estado !== 'Libre' && abrirModalDetalleCelda(celda.id!)">

      <div class="mb-4">
        <div [ngClass]="{
               'bg-green-600': celda.estado === 'Libre',
               'bg-red-600': celda.estado === 'Ocupado',
               'bg-yellow-600': celda.estado === 'Reservado'
             }"
             class="w-8 h-8 mx-auto rounded-full flex items-center justify-center text-white">
          <ng-container [ngSwitch]="celda.estado">
            <div *ngSwitchCase="'Libre'">⬛</div>
            <div *ngSwitchCase="'Ocupado'">🚗</div>
            <div *ngSwitchCase="'Reservado'">🕒</div>
          </ng-container>
        </div>
      </div>

      <p class="text-lg font-semibold">{{ celda.codigo }}</p>
      <p class="mt-1"
         [ngClass]="{
           'text-green-600': celda.estado === 'Libre',
           'text-red-600': celda.estado === 'Ocupado',
           'text-yellow-600': celda.estado === 'Reservado'
         }">
        {{ celda.estado.charAt(0).toUpperCase() + celda.estado.slice(1) }}
      </p>
    </div>
  </div>
</div>

<!-- Modal para crear celda -->
<app-crear-celda 
  *ngIf="mostrarModal"
  (cerrar)="cerrarModalCrearCelda()" 
  (guardar)="guardarNuevaCelda($event)">
</app-crear-celda>

<!-- Modal para mostrar detalle del parqueo -->
<app-detalle-celda
  *ngIf="mostarDetalleCelda"
  [detalleParqueo]="detalleParqueo"
  (cerrar)="cerrarModalDetalleCelda()"> 
</app-detalle-celda>


<!-- Modal para registrar parqueo -->
<app-crear-parqueo></app-crear-parqueo>
