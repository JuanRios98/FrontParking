<div class="p-4">
  <button class="bg-blue-600 text-white px-4 py-2 rounded-lg"
  (click)="abrirModalCrearCelda()">Crear</button>
</div>

<div class="p-6">
  <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
    📦 Celdas del Parqueadero
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    <!-- Celda 1 - Disponible -->
    <div class="rounded-lg p-6 border shadow-sm text-center bg-green-100 border-green-300">
      <div class="mb-4">
        <div class="w-8 h-8 mx-auto rounded-full flex items-center justify-center text-white bg-green-600">
          ⬛
        </div>
      </div>
      <p class="text-lg font-semibold">Celda A1</p>
      <p class="mt-1 text-green-600">Disponible</p>
    </div>

    <!-- Celda 2 - Ocupada -->
    <div class="rounded-lg p-6 border shadow-sm text-center bg-red-100 border-red-300">
      <div class="mb-4">
        <div class="w-8 h-8 mx-auto rounded-full flex items-center justify-center text-white bg-red-600">
          🚗
        </div>
      </div>
      <p class="text-lg font-semibold">Celda B2</p>
      <p class="mt-1 text-red-600">Ocupada</p>
    </div>

    <!-- Celda 3 - Reservada -->
    <div class="rounded-lg p-6 border shadow-sm text-center bg-yellow-100 border-yellow-300">
      <div class="mb-4">
        <div class="w-8 h-8 mx-auto rounded-full flex items-center justify-center text-white bg-yellow-600">
          🕒
        </div>
      </div>
      <p class="text-lg font-semibold">Celda C3</p>
      <p class="mt-1 text-yellow-600">Reservada</p>
    </div>
  </div>
</div>

<app-crear-celda 
  *ngIf="mostrarModal"
  (cerrar)="cerrarModalCrearCelda()" 
  (guardar)="guardarNuevaCelda($event)">
</app-crear-celda>
